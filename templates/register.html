{% extends "base.html" %}

{% block title %}Register - SocialConnect{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">📝</div>
                <h2 class="fw-bold mt-2">Join SocialConnect</h2>
                <p class="text-muted">Create your account to start sharing</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-1 text-primary"></i> Username</label>
                    <input type="text" class="form-control" name="username" value="{{ username or '' }}" placeholder="Choose a username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1 text-primary"></i> Email</label>
                    <input type="email" class="form-control" name="email" value="{{ email or '' }}" placeholder="your@email.com" required>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-lock me-1 text-primary"></i> Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Min 6 chars" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="fas fa-lock me-1 text-primary"></i> Confirm</label>
                        <input type="password" class="form-control" name="confirm_password" placeholder="Repeat" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3">
                    <i class="fas fa-user-plus me-1"></i> Create Account
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">{{ t('Login here') }}</a>
            </p>
        </div>
    </div>
{% endblock %}
