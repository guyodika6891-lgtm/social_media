{% extends "base.html" %}

{% block title %}Login - SocialConnect{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">🔑</div>
                <h2 class="fw-bold mt-2">Welcome Back</h2>
                <p class="text-muted">{{ t('Login to your account') }}</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-user me-1 text-primary"></i> Username</label>
                    <input type="text" class="form-control" name="username" placeholder="Your username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label"><i class="fas fa-lock me-1 text-primary"></i> Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3">
                    <i class="fas fa-sign-in-alt me-1"></i> {{ t('Login') }}
                </button>
            </form>
            <p class="text-center mt-4 mb-0">
                Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">{{ t('Register here') }}</a>
            </p>
        </div>
    </div>
{% endblock %}
