{% extends "base.html" %}

{% block title %}New Post{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 class="fw-bold mb-4"><i class="fas fa-pen text-primary me-2"></i>{{ t('Create Post') }}</h2>

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">What's on your mind?</label>
                    <textarea class="form-control" name="content" rows="5" placeholder="Share your thoughts..." required>{{ content or '' }}</textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label"><i class="fas fa-image me-1 text-primary"></i> Add Image (optional)</label>
                    <input type="file" class="form-control" name="image" accept="image/*">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill py-3">
                        <i class="fas fa-paper-plane me-1"></i> Post
                    </button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary flex-fill py-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
