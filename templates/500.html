{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
    <div class="text-center py-5">
        <div style="font-size: 6rem; background: linear-gradient(135deg, #ef4444, #dc2626); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;">500</div>
        <h3 class="mt-3 fw-bold">Something Went Wrong</h3>
        <p class="text-muted">Our server had a problem. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-home me-1"></i> Go Home</a>
    </div>
{% endblock %}
