{% extends "base.html" %}
{% block title %}Not Found{% endblock %}
{% block content %}
    <div class="text-center py-5">
        <div style="font-size: 6rem; background: var(--gradient-hero); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900;">404</div>
        <h3 class="mt-3 fw-bold">Page Not Found</h3>
        <p class="text-muted">The page you're looking for doesn't exist.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fas fa-home me-1"></i> Go Home</a>
    </div>
{% endblock %}
