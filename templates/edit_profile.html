{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 class="fw-bold mb-4"><i class="fas fa-edit text-primary me-2"></i>{{ t('Edit Profile') }}</h2>

            <form method="POST" enctype="multipart/form-data">
                <div class="card mb-3">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">{{ t('Profile Picture') }}</h5>
                        <div class="d-flex align-items-center gap-3">
                            {% if user.profile_picture %}
                                <img src="{{ url_for('static', filename='uploads/profiles/' + user.profile_picture) }}" class="avatar avatar-lg">
                            {% else %}
                                <div class="avatar avatar-lg">{{ user.username[0]|upper }}</div>
                            {% endif %}
                            <input type="file" class="form-control" name="profile_picture" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">About You</h5>
                        <div class="mb-3">
                            <label class="form-label">Bio</label>
                            <textarea class="form-control" name="bio" rows="3" placeholder="Tell us about yourself...">{{ user.bio or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location" value="{{ user.location or '' }}" placeholder="e.g., Addis Ababa, Ethiopia">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill py-3">
                        <i class="fas fa-save me-1"></i> Save Changes
                    </button>
                    <a href="{{ url_for('profile', username=user.username) }}" class="btn btn-secondary flex-fill py-3">{{ t('Cancel') }}</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
